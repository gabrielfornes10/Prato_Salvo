<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prato Salvo — Rota de entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  PÁGINA: Rota de entrega
  Tela de acompanhamento de pedido em tempo real (simulado): status
  do pedido, mapa com a rota até o cliente, e um cronômetro
  regressivo animando a posição do entregador. Aberta automaticamente
  logo depois que o cliente finaliza uma compra no App Cliente.
-->
<link rel="stylesheet" href="entrega.css">
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand" id="ps-brand">Prato Salvo</div>
      <div class="order-code">Pedido #48213</div>
    </div>

    <div class="status-row">
      <p class="status-title">A caminho até você</p>
      <div class="steps">
        <div class="step done"></div>
        <div class="step done"></div>
        <div class="step active"></div>
        <div class="step"></div>
      </div>
      <div class="step-labels">
        <span class="on">Confirmado</span>
        <span class="on">Preparo</span>
        <span class="on">A caminho</span>
        <span>Entregue</span>
      </div>
    </div>

    <div class="map-wrap">
      <div class="eta-chip">
        <span class="dot"></span>
        <div>
          <div class="eta-time" id="etaTime">25:00</div>
          <div class="eta-sub">até a entrega</div>
        </div>
      </div>

      <svg viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="320" fill="#171B21"/>
        <g stroke="#232830" stroke-width="1">
          <line x1="0" y1="60" x2="400" y2="60"/>
          <line x1="0" y1="130" x2="400" y2="130"/>
          <line x1="0" y1="205" x2="400" y2="205"/>
          <line x1="0" y1="270" x2="400" y2="270"/>
          <line x1="90" y1="0" x2="90" y2="320"/>
          <line x1="180" y1="0" x2="180" y2="320"/>
          <line x1="280" y1="0" x2="280" y2="320"/>
        </g>
        <g fill="#1E232B">
          <rect x="14" y="14" width="60" height="34" rx="4"/>
          <rect x="110" y="20" width="50" height="28" rx="4"/>
          <rect x="200" y="14" width="66" height="34" rx="4"/>
          <rect x="300" y="18" width="70" height="30" rx="4"/>
          <rect x="14" y="80" width="60" height="34" rx="4"/>
          <rect x="200" y="76" width="66" height="38" rx="4"/>
          <rect x="300" y="82" width="70" height="34" rx="4"/>
          <rect x="14" y="150" width="60" height="40" rx="4"/>
          <rect x="110" y="150" width="50" height="40" rx="4"/>
          <rect x="300" y="150" width="70" height="40" rx="4"/>
          <rect x="14" y="222" width="60" height="34" rx="4"/>
          <rect x="110" y="222" width="50" height="34" rx="4"/>
          <rect x="200" y="222" width="66" height="34" rx="4"/>
        </g>

        <path id="route" d="M 42 31 L 42 60 L 135 60 L 135 130 L 230 130 L 230 205 L 340 205 L 340 260 L 340 290"
          fill="none" stroke="#3A4048" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="routeDone" d="M 42 31 L 42 60 L 135 60 L 135 130 L 230 130 L 230 205 L 340 205 L 340 260 L 340 290"
          fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="600" stroke-dashoffset="600"/>

        <g transform="translate(42,31)">
          <circle r="9" fill="#171B21" stroke="var(--mint)" stroke-width="2.5"/>
          <circle r="3.4" fill="var(--mint)"/>
        </g>
        <g transform="translate(340,290)">
          <circle r="10" fill="var(--mint)"/>
          <path d="M -4 1 L -1.2 3.8 L 4.5 -3" stroke="#0E1F17" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g id="courierMarker" transform="translate(42,31)">
          <circle r="13" fill="var(--accent-dim)"/>
          <circle r="9" fill="var(--accent)"/>
          <text x="0" y="3.5" text-anchor="middle" font-size="11" fill="#241305">🛵</text>
        </g>
      </svg>
    </div>

    <div class="courier">
      <div class="avatar">RS</div>
      <div class="courier-info">
        <p class="courier-name">Rafael Souza</p>
        <p class="courier-sub">Entregador · 4.9 ★ · moto</p>
      </div>
      <div class="call-btn" title="Ligar (fictício)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F3F1EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/>
        </svg>
      </div>
    </div>

    <div class="details">
      <div class="detail-box">
        <div class="detail-label">Telefone</div>
        <div class="detail-value">(21) 98765-4321</div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Placa da moto</div>
        <div class="detail-value">BRA2E19</div>
      </div>
    </div>
  </div>

<script src="entrega.js"></script>
<script src="entrega-bridge.js"></script>
</body>
</html>
